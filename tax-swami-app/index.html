<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Applies the saved (or system) theme to <html> before the stylesheet
         paints, so the page never flashes the wrong theme on load. Kept
         inline and tiny on purpose - it has to run before first paint. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('taxswami-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='17' font-weight='700' fill='%23ffffff' text-anchor='middle'%3ETS%3C/text%3E%3C/svg%3E"
    />
    <title>TaxSwami - Taxes, sorted</title>
    <meta
      name="description"
      content="Friendly, reliable income tax filing, GST registration, and compliance support from chartered accountants. Book a free consultation today."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
